<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workbench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23232528%27/%3E%3Crect x=%274%27 y=%274%27 width=%2724%27 height=%274%27 fill=%27%238f1d33%27/%3E%3Cpath d=%27M5 11l4 16 7-10 7 10 4-16%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273.2%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">

  <header class="top">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="5" width="22" height="5" rx="1.5" fill="#8f1d33"></rect><polyline points="5,12.5 9.5,23 14,15.5 18.5,23 23,12.5" fill="none" stroke="#f0f0f0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
      <span class="brand-name">Workbench</span>
    </div>
    <nav class="tabs" aria-label="Áreas de trabalho">
      <button type="button" class="tab on" data-act="tab" data-v="editar" aria-current="page">Editar</button>
      <button type="button" class="tab" data-act="tab" data-v="cor">Cor</button>
      <button type="button" class="tab" data-act="tab" data-v="entrega">Entrega</button>
    </nav>
    <div class="panels" id="panels" role="group" aria-label="Painéis abertos"></div>
    <div class="grow"></div>
    <div class="group" role="group" aria-label="Histórico de ações">
      <button type="button" class="btn" data-act="undo" id="undo-top"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5 M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Desfazer</button>
      <button type="button" class="btn" data-act="redo" id="redo-top"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5 M20 9H10a6 6 0 0 0 0 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Refazer</button>
    </div>
    <button type="button" class="proj-pill" id="proj-pill" data-act="project-menu" title="Projeto: salvar, abrir, briefing"></button>
    <div class="group" role="group" aria-label="Entrega">
      <div class="seg" id="container" role="group" aria-label="Formato do arquivo"><button type="button" data-act="container" data-v="mp4">MP4</button><button type="button" data-act="container" data-v="mov">MOV</button></div>
      <button type="button" class="btn pill solid" data-act="export" id="export-top">Exportar</button>
      <button type="button" class="btn pill" data-act="pack">Premiere · AE · CapCut</button>
    </div>
    <div class="avatar" id="avatar" aria-hidden="true">D</div>
  </header>

  <div class="body">

    <!-- ===================== EDITAR ===================== -->
    <section class="view v-editar" id="view-editar">
      <div class="col-left">
        <nav class="rail" id="rail" aria-label="Ferramentas"></nav>
        <div class="split split-x" data-split="left" title="Arraste pra mudar a largura"></div>
        <div class="stack">
          <aside class="card panel" id="material" aria-label="Material"></aside>
          <aside class="card panel" id="efeitos" aria-label="Efeitos"></aside>
        </div>
      </div>

      <div class="col-center">
        <section class="card monitor" id="monitor" aria-label="Monitor">
          <div class="mon-top">
            <div class="seg" id="plats" role="group" aria-label="Plataforma"></div>
            <div class="mon-top-r">
              <button type="button" class="btn sm style-pill" id="style-pill" data-act="style-open"></button>
              <div class="seg sm" id="ratios" role="group" aria-label="Formato da prévia"></div>
            </div>
          </div>
          <div class="mon-mid">
            <div class="stage" id="stage">
              <div class="frame" id="frame">
                <canvas id="cv-mon" aria-label="Prévia do vídeo com efeitos e cor"></canvas>
                <div class="masklayer" id="masklayer" aria-hidden="true"></div>
                <div class="chip chip-l" id="fx-chip" hidden></div>
                <div class="chip chip-r" id="scene-chip" hidden></div>
                <div class="audio-card" id="audio-card" hidden><strong>Áudio</strong><span id="audio-name"></span></div>
              </div>
              <div class="empty" id="empty">
                <div class="empty-title">Comece pelo teu material</div>
                <div class="empty-sub">Qualquer vídeo, áudio ou foto, inclusive de Osmo, Lumix e RAW. O arquivo fica no teu computador, nada é enviado.</div>
                <div class="starts">
                  <button type="button" class="start" data-act="add-files"><b>Adicionar arquivos</b><span>Vídeo, áudio, foto. Qualquer formato.</span></button>
                  <button type="button" class="start" data-act="add-folder"><b>Pasta do computador</b><span>Qualquer pasta, com Falas, Cenas e Overlays.</span></button>
                </div>
                <div id="resume"></div>
                <div class="empty-sub">Ou arraste arquivos e pastas pra qualquer lugar da tela.</div>
              </div>
            </div>
            <aside class="pal" id="pal" aria-label="Paleta"></aside>
          </div>
          <div class="transport">
            <div class="tleft"><span class="mono" id="timecode">00:00,0 <span class="muted">/ 00:00,0</span></span><div class="seg sm" id="mtools" role="group" aria-label="Ferramentas no vídeo"></div></div>
            <div class="tbtns">
              <button type="button" class="btn sq" data-act="step-back" aria-label="Voltar 0,1 s"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M7 6v12 M19 6l-9 6 9 6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
              <button type="button" class="btn sq solid wide" data-act="play" id="play" aria-label="Tocar"></button>
              <button type="button" class="btn sq" data-act="step-fwd" aria-label="Avançar 0,1 s"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M17 6v12 M5 6l9 6-9 6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
            </div>
            <div class="mon-right"><span class="muted ell" id="analysis" role="status"></span><button type="button" class="link-btn" id="fxprev" data-act="fxprev" aria-pressed="true">Prévia com efeitos e cor</button></div>
          </div>
        </section>
      </div>

      <aside class="col-right"><div class="split split-x l" data-split="right" title="Arraste pra mudar a largura"></div><div class="card inspector" id="inspector" aria-label="Inspetor"></div></aside>

      <div class="bottom">
        <div class="split split-y" data-split="bottom" title="Arraste pra mudar a altura da timeline"></div>
        <section class="card tl-wrap" aria-label="Timeline">
          <div class="detector" id="detector" aria-label="Detector de cenas"></div>
          <div class="autofx" id="autofx" aria-label="Sugestões automáticas"></div>
          <div id="tl-card" class="timeline"></div>
        </section>
      </div>
    </section>

    <!-- ===================== COR ===================== -->
    <section class="view v-cor" id="view-cor" hidden>
      <div class="col-left cor-left">
        <div class="split split-x" data-split="left" title="Arraste pra mudar a largura"></div>
        <aside class="card panel" id="c-album" aria-label="Álbum de stills"></aside>
        <aside class="card panel" id="c-pal" aria-label="Paleta"></aside>
        <aside class="card panel" id="c-luts" aria-label="LUTs"></aside>
      </div>
      <div class="col-center">
        <div class="cor-mid">
          <section class="card viewer" id="c-viewer" aria-label="Visualizador"></section>
          <div class="scopes" id="c-scopes"></div>
        </div>
      </div>
      <aside class="col-right"><div class="split split-x l" data-split="right" title="Arraste pra mudar a largura"></div><div class="card inspector" id="c-insp" aria-label="Inspetor de cor"></div></aside>
      <div class="bottom cor-bottom">
        <div class="split split-y" data-split="bottom" title="Arraste pra mudar a altura"></div>
        <section class="card nodes" id="c-nodes" aria-label="Nós"></section>
        <section class="card shots" id="c-shots" aria-label="Grades por grupo de cenas"></section>
      </div>
    </section>

    <!-- ===================== ENTREGA ===================== -->
    <section class="view v-entrega" id="view-entrega" hidden>
      <div class="col-left"><aside class="card panel" id="e-dest" aria-label="Destinos"></aside></div>
      <div class="col-center">
        <section class="card e-prev" id="e-prev" aria-label="Prévia da entrega"></section>
        <section class="card e-queue" id="e-queue" aria-label="Fila de render"></section>
      </div>
      <aside class="col-right"><div class="card inspector" id="e-opts" aria-label="Formato de saída"></div></aside>
    </section>
  </div>
</div>

<video id="video" playsinline preload="auto" hidden></video>
<img id="still" alt="" hidden>

<input id="file" type="file" multiple hidden>
<input id="dir" type="file" webkitdirectory multiple hidden>
<input id="proj" type="file" accept=".json,application/json" hidden>
<input id="lut-file" type="file" accept=".cube" hidden>
<input id="ref-file" type="file" accept="image/*" hidden>
<a id="dl" hidden></a>

<dialog id="drive-dlg" aria-label="Google Drive"></dialog>
<dialog id="dlg" aria-label="Janela"></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<div class="drop" id="drop" hidden><div>Solte aqui pra adicionar ao Material</div></div>

<script>
// Se o navegador misturar arquivos velhos do cache com os novos (logo depois de uma atualização), o app não abre.
// Aí baixa tudo de novo, sem cache, e recarrega uma vez.
setTimeout(async () => {
  if (window.__wb || sessionStorage.getItem('wb.refetch')) return;
  sessionStorage.setItem('wb.refetch', '1');
  const mods = ["app", "config", "convert", "detect", "drive", "export", "eyecandy", "filmgrab", "fx", "grade", "history", "layout", "library", "masks", "media", "model", "project", "raw", "render", "sampler", "sound", "sources", "store", "transcribe", "transcribe-worker", "transcript", "ui-cor", "ui-editar", "ui-entrega", "ui-material"];
  await Promise.all(mods.map((n) => fetch('js/' + n + '.js', { cache: 'reload' }).catch(() => {})));
  await fetch('css/app.css', { cache: 'reload' }).catch(() => {});
  location.reload();
}, 5000);
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
